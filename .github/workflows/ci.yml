name: ci

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  autogreen:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Auto green
        env:
          RANDOM_COMMIT: ${{ vars.RANDOM_COMMIT }}
        run: |
          git config --local user.email "61406895+SadYuyuko@users.noreply.github.com"
          git config --local user.name "SadYuyuko"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          if [ "$RANDOM_COMMIT" = "1" ]; then
            count=$(( (RANDOM % 10) + 1 ))
            echo "Random commit count: $count"
            for i in $(seq 1 "$count"); do
              git commit --allow-empty -m "A commit a day keeps life green ($i/$count)"
            done
          else
            git commit --allow-empty -m "A commit a day keeps life green"
          fi
          git push
